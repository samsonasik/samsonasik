<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Animated flame">
  <style>
    .outer {
      transform-origin: 16px 28px;
      animation: wave 0.38s ease-in-out infinite alternate;
    }

    .inner {
      transform-origin: 16px 28px;
      animation: wave 0.32s ease-in-out infinite alternate-reverse;
    }

    @keyframes wave {
      0% { transform: skewX(-4deg) translateX(-0.8px); }
      100% { transform: skewX(4deg) translateX(0.8px); }
    }
  </style>

